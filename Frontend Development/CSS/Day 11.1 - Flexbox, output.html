<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Day 11.1 - flexbox, output</title>

	<style>
		.outer {
			width: 800px;
			height: 95vh; /*100vh can use for the full screen*/  
			border: 2px solid firebrick;
			display: flex;
			flex-direction: row;
			justify-content: space-around;
		}

		.box {
			width: 150px;
			height: 150px;
			border: 2px solid deeppink;
		}

		/*.outer:hover {
			flex-direction: row-reverse;
			justify-content: flex-end;
		}*/

		img {
			width: 100%; /*we can use the 100% of div box 150px*/ 
		}
	</style>
</head>
<body>
	<div class="outer">
		<div class="box"><img src=".\img\Spiderman.jpg"></div>
		<div class="box"><img src=".\img\download (9).jpg"></div>
		<div class="box"><img src=".\img\download (5).jpg"></div>
		<div class="box"><img src=".\img\download (4).jpg"></div>
		
	</div>
</body>
</html>
