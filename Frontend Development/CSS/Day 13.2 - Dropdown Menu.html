<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Day 13.2 - dropdown menu.</title>

	<style>

		body {
			margin: 0px;
			padding: 0px;
		}
		
		ul {
			list-style: none;
			margin: 0;
			padding: 0;
			background-color: goldenrod;
			/*display: flex;*/
			/*padding: 10px 0px;*/
		}

		ul li {
			display: inline-block;
			width: 100px;
			position: relative;
			padding: 10px 0px;
			text-align: center;
		}

		ul li a {
			color: black;
			text-decoration: none;
		}

		ul li ul {
			margin-top: 10px;
			display: none;
		}

		ul li:hover ul{
			display: block;
			position: absolute;
		}

		ul li:hover {
			background-color: #f5dc98;
		}
	</style>
</head>
<body>
	<ul>
		<li><a href="#">Home</a></li>
		<li><a href="#">About</a></li>
		<li><a href="#">Department</a>
			<ul>
				<li><a href="#">IT</a></li>
				<li><a href="#">CSE</a></li>
				<li><a href="#">EXTC</a></li>
			</ul>
		</li>

		<li><a href="#">Contact</a></li>
		<li><a href="#">Support</a></li>
	</ul>
</body>
</html>
