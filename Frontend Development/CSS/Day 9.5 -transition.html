<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Day 9.4 - transition</title>

	<style>
		
		img {
			width: 200px;	
			height: 200px;
			border: 5px dotted deepskyblue;

			transition-property: border-radius, border;
			transition-duration: 2s;

			/*transition: border-radius 2s, border 2s;*/

			/*transition: all 2s;*/
		}

		img:hover {
			border-radius: 50%;
			border: 5px dashed hotpink;
		}
	</style>

</head>
<body>
	<img src="./img/Pookie_Spidy.jpg">
</body>
</html>
