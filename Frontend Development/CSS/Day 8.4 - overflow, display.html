<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Day 7.2 - Border, Padding, Margin, Box-sizing, box-shadow</title>

	<style>

		body {
			margin: 0px;
		}

		div {
			width: 400px;
			height: 300px;
			border: 5px solid cornflowerblue;
			overflow: auto;
		}

		ul {
			padding: 10px;
			list-style: none;
			border: 3px solid cornflowerblue;
			background-color: sandybrown;
		}

		li {
			display: inline;
			padding: 5px 20px;

		}

		li:hover {
			color: white;
			background-color: powderblue;
		}

		li a {
			color: black;
			text-decoration: none;
			transition: background-color 0.5s, color 0.5s;
			/*transition: all 0.5s;*/

		}


	</style>
</head>
<body>
	<ul>
		<li><a href="#">Home</a></li>
		<li><a href="#">About</a></li>
		<li><a href="#">Department</a></li>
		<li><a href="#">Contact</a></li>
	</ul>
	
</body>
</html>


NOTE
display : inline -> block level element into inline (ek line madhe)
block : inline -> block (separate line)

block level elements : h1 to h6, ul li, div, p
