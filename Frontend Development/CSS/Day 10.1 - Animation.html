<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Day 10.1 - animation. flex.</title>

	<style>
		#noticebtn {
			animation-name: noticeanim;
			animation-duration: 1s;
			animation-iteration-count: infinite;
			background-color: #996db0;
			color: ghostwhite;
			border: 2px dashed #9a2bd6;
			width: 100px;
			height: 50px;
			padding: 5px;
			border-radius: 5px;
		}

		@keyframes noticeanim {
			from {
				opacity: 0;
			}
			to {
				opacity: 1;
			}
		}
	</style>
</head>
<body>
	<h1>Get the 50%  Discount on latest on <span id="productname">Shirt</span></h1>

	<button id="noticebtn">Study in India</button>
</body>
</html>
