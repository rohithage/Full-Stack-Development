<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Day 12.2 - float, filter, media.</title>
	<style>
		#jpg {
			width: 300px;
			/*filter: blur(10px);*/
			filter: grayscale(100%);
		}

		#jpg:hover {
			/*filter: blur(0px);*/
			filter: grayscale(0%);
		}

		#png {
			width: 300px;
			filter: drop-shadow(10px 10px 2px red);
		}
	</style>
</head>
<body>
	<img id="jpg" src=".\img\download (5).jpg">

	<img id="png" src=".\img\removebg-.png">
</body>
</html>
