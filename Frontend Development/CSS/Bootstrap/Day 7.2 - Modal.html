<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Day 7.2 - Toggable List Group, Modal.</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

</head>
<body>
	<button data-target="#regmodal" data-toggle="modal">Register</button>
	<button data-target="#loginmodal" data-toggle="modal">Login</button>

	<div class="modal" id="loginmodal">
		<div class="modal-dialog">

			<div class="modal-content">

				<div class="modal-header"><h4>Login Form</h4></div>

				<div class="modal-body">

					<form>
						<input type="email" placeholder="Email" class="form-control mb-3">

						<input type="Password" placeholder="Password" class="form-control mb-3">

						<button class="btn btn-success mt-3 form-control">Login</button>

						<p class="mt-2">Don't Have an account? <a href="#regmodal" data-dismiss="modal" data-toggle="modal">Sign Up</a></p>
					</form>
				</div>

				<div class="modal-footer">
					<button class="btn btn-danger" data-dismiss="modal">Close</button>
				</div>

			</div>
		</div>
	</div>

	<div class="modal" id="regmodal">

		<div class="modal-dialog">

			<div class="modal-content">

				<div class="modal-header"><h4>Register Form</h4></div>

				<div class="modal-body">

					<form>
						<input type="text" placeholder="Full Name" class="form-control mb-3">

						<input type="email" placeholder="Email" class="form-control mb-3">

						<input type="tel" placeholder="contact No" class="form-control mb-3">

						<input type="Password" placeholder="Password" class="form-control mb-3">

						<button class="btn btn-success mt-3 form-control">Register</button>
						
						<p class="mt-2">Already Have an account? <a href="#loginmodal" data-toggle="modal" data-dismiss="modal">Sign In</a></p>
					</form>

				</div>

				<div class="modal-footer">
					<button class="btn btn-danger" data-dismiss="modal">Close</button>
				</div>

			</div>
		</div>
	</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>

	<script>
		$(document).ready(function(){
			setTimeout(function(){

				$("#loginmodal").modal('show');

			}, 5000)
		});
	</script>
</body>
</html>
