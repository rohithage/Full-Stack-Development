<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Day 8.1 - Slider And Carousel</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>

	<header>
		<ul class="nav justify-content-end">
			<li><a href="#" class="nav-link">Home</a></li>
			<li><a href="#" class="nav-link">About</a></li>
			<li><a href="#" class="nav-link">Department</a></li>
			<li><a href="#" class="nav-link">Lab</a></li>
			<li><a href="#" class="nav-link">Contact</a></li>
		</ul>
	</header>

	<div class="carousel slide" id="demo" data-ride="carousel">

		<ol class="carousel-indicators">
			<li class="active" data-target="#demo" data-slide-to="0"></li> <!-- this active can be optional -->
			<li data-target="#demo" data-slide-to="1"></li>
			<li data-target="#demo" data-slide-to="2"></li>
		</ol>

		<div class="carousel-inner">
			<div class="carousel-item active"> <!-- this active has compulsory to show first img if not choose the first img then output can not be show -->
				<img src=".\img\landscape4.jpg" class="d-block w-100">
			</div>

			<div class="carousel-item">
				<img src=".\img\screenshot2.jpg" class="d-block w-100">
			</div>

			<div class="carousel-item">
				<img src=".\img\screenshot3.jpg" class="d-block w-100">
			</div>
		</div>

		<button class="carousel-control-prev" type="button" data-target="#demo" data-slide="prev">
	    	<span class="carousel-control-prev-icon"></span>
	    	<span class="visually-hidden">Previous</span>
	  	</button>
	  	<button class="carousel-control-next" type="button" data-target="#demo" data-slide="next">
	    	<span class="carousel-control-next-icon"></span>
	    	<span class="visually-hidden">Next</span>
	  	</button>

	</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>

</body>
</html>
